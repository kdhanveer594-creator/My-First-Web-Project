<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Sissors Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Rock Paper Sissors</h1>
    <div class="choices">
        <div class="choice" id="rock">
            <img src="https://www.vhv.rs/dpng/d/98-985146_close-hand-emoji-hd-png-download.png" />
        </div>
        <div class="choice" id="paper">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTS6fnrQRxQGWW0G5c8tyXNigYpRZR2Rk5zU8iPULavuw&s=10"/>
        </div>
        <div class="choice" id="scissor">
            <img src="https://grammarmean.com/wp-content/uploads/2026/02/Thumbs-Up-Emoji-Meaning-What-It-Really-Says-In-Daily-Chats.webp"/>
        </div>
    </div>
    <div class="score-board">
        <div class="score" >
            <p id="user-score">0</p>
            <p>You</p>
             </div>
            <div class="score">
                <p id="comp-score">0</p>
                <p>Comp</p>
        </div>
    </div>
    <div class="message-container">
    <div class="msg">Play Your Game
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
